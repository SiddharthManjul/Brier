name: Robot CI

on:
  pull_request:
    paths:
      - .github/policies/robot.yaml
      - .github/workflows/robot-ci.yml
      - crates/brier-core/**
      - py/brier_sim/**
      - py/brier_explain/**
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git commit or ref containing the deployed policy snapshot
        type: string
        required: true
      policy_path:
        description: Policy snapshot to compare with base_ref
        type: string
        default: .github/policies/robot.yaml
        required: true

permissions:
  contents: read

concurrency:
  group: robot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      t0_identical: ${{ steps.card.outputs.t0_identical }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and compare policy identities
        id: card
        run: |
          cargo build --release --locked -p brier-core
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              if event["pull_request"]["head"]["repo"]["full_name"] != os.environ["GITHUB_REPOSITORY"]:
                  raise SystemExit("Robot CI requires a same-repository policy PR")
              base = event["pull_request"]["base"]["sha"]
              policy = Path(".github/policies/robot.yaml")
          else:
              base = event["inputs"]["base_ref"]
              policy = Path(event["inputs"]["policy_path"])
          if policy.is_absolute() or ".." in policy.parts or policy.parts[:2] != (".github", "policies") or policy.suffix != ".yaml":
              raise SystemExit("policy_path must be a YAML file under .github/policies")
          base = subprocess.check_output(["git", "rev-parse", f"{base}^{{commit}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          change = f"c{1000 + int(head[:15], 16)}"
          output = Path(os.environ["RUNNER_TEMP"]) / "brier-ci"
          output.mkdir()
          shutil.copy2("target/release/brier", output / "brier")
          with (output / "before.yaml").open("wb") as target:
              subprocess.run(["git", "show", f"{base}:{policy.as_posix()}"], stdout=target, check=True)
          shutil.copyfile(policy, output / "after.yaml")
          with (output / "card.json").open("w") as target:
              subprocess.run([str(output / "brier"), "card", "--before", str(output / "before.yaml"),
                              "--after", str(output / "after.yaml"), "--change", change], stdout=target, check=True)
          card = json.loads((output / "card.json").read_text())
          changed = subprocess.check_output(["git", "diff", "--name-only", base, head], text=True).splitlines()
          t0 = card["t0_identical"] and all(path == policy.as_posix() for path in changed)
          (output / "source-identity.json").write_text(json.dumps({"base": base, "head": head,
              "changed_paths": changed, "t0_applied": t0}, indent=2) + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as target:
              target.write(f"t0_identical={str(t0).lower()}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as target:
              if t0:
                  target.write("## Robot CI: T0 pass\n\nPinned checkpoint and effective no-op parameters are identical. "
                               "The source diff contains only this policy snapshot. No evaluations were requested. "
                               "The identity proof is attached as an artifact; no statistical calibration claim is made.\n")
              else:
                  target.write("## Robot CI: evaluation required\n\nThe card is validated. "
                               "Configured baseline, scoring and explanation stages must complete before a verdict.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-ci-input
          path: ${{ runner.temp }}/brier-ci
          if-no-files-found: error

  evaluate:
    needs: card
    if: needs.card.outputs.t0_identical != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      BRIER_DATA: ${{ vars.BRIER_DATA }}
      MODAL_DECIDE_URL: ${{ vars.MODAL_DECIDE_URL }}
      META_API_KEY: ${{ secrets.META_API_KEY }}
      BRIER_INGEST_TOKEN: ${{ secrets.BRIER_INGEST_TOKEN }}
      BRIER_INGEST_URL: ${{ vars.BRIER_INGEST_URL }}
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: robot-ci-input
          path: ${{ runner.temp }}/brier-ci
      - name: Require rollout configuration and complete CLI interfaces
        run: |
          chmod +x "$RUNNER_TEMP/brier-ci/brier"
          "$RUNNER_TEMP/brier-ci/brier" explain --help
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          for name in ("BRIER_DATA", "MODAL_DECIDE_URL", "META_API_KEY", "BRIER_INGEST_TOKEN", "BRIER_INGEST_URL"):
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Robot CI requires {name}; no rollout was started")
          if not os.environ["BRIER_DATA"].startswith("gs://"):
              raise SystemExit("Robot CI requires a GCS BRIER_DATA snapshot")
          if urlsplit(os.environ["MODAL_DECIDE_URL"]).scheme != "https":
              raise SystemExit("MODAL_DECIDE_URL must be the deployed HTTPS endpoint")
          ingest = urlsplit(os.environ["BRIER_INGEST_URL"])
          if ingest.scheme != "https" or not ingest.netloc or ingest.path != "/api/ingest" or ingest.query or ingest.fragment or ingest.username:
              raise SystemExit("BRIER_INGEST_URL must be the deployed HTTPS /api/ingest URL")
          PY
      - name: Require GCP identity configuration
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == ''
        run: |
          echo '::error::Configure GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT before running Robot CI'
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install CPU simulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2 libopengl0
          pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Fetch the frozen evaluation snapshot
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "brier-cloud-source.txt").write_text(os.environ["BRIER_DATA"].rstrip("/"))
          PY
          mkdir "$RUNNER_TEMP/brier-data"
          for artifact in bundle-manifest.json ledger.sqlite compiled.jsonl scenarios.jsonl risk-calibration.json t1.json replay-scores.json report.json baseline-policy.yaml aloha-baseline-policy.yaml; do
            gcloud storage cp "${BRIER_DATA%/}/$artifact" "$RUNNER_TEMP/brier-data/$artifact"
          done
          printf 'BRIER_DATA=%s\n' "$RUNNER_TEMP/brier-data" >> "$GITHUB_ENV"
      - name: Verify the prepared decision bundle before evaluation
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sqlite3

          from brier_ml.dataset import _compiled_rows
          from brier_ml.glimmer_data import calibration_partition

          root = Path(os.environ["BRIER_DATA"])
          manifest = json.loads((root / "bundle-manifest.json").read_text())
          required = {"ledger.sqlite", "compiled.jsonl", "scenarios.jsonl", "risk-calibration.json", "t1.json", "replay-scores.json",
                      "report.json", "baseline-policy.yaml", "aloha-baseline-policy.yaml"}
          if manifest.get("schema") != "brier-decision-bundle-v1" or set(manifest.get("files", {})) != required:
              raise SystemExit("Robot CI requires the complete checksummed decision bundle")
          if not re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("training_completion_sha256"))):
              raise SystemExit("Decision bundle must bind the immutable training-completion receipt")
          for name, digest in manifest["files"].items():
              if not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit(f"Invalid bundle checksum for {name}")
              with (root / name).open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              if actual != digest:
                  raise SystemExit(f"Decision bundle checksum mismatch: {name}")
          if manifest.get("data_sha256") != manifest["files"]["compiled.jsonl"]:
              raise SystemExit("Decision bundle does not bind the compiled dataset")
          if manifest.get("release_hashes", {}).get("scenarios.jsonl") != manifest["files"]["scenarios.jsonl"]:
              raise SystemExit("Decision bundle must retain the exact frozen scenario source")
          definitions = [json.loads(line) for line in (root / "scenarios.jsonl").read_text().splitlines()]
          with sqlite3.connect((root / "ledger.sqlite").resolve().as_uri() + "?mode=ro", uri=True) as connection:
              stored = {row[0]: row[1:] for row in connection.execute("SELECT scenario_id,env,params_json,baseline_success FROM scenarios")}
          if len(definitions) != 32 or {row["scenario_id"] for row in definitions} != set(stored):
              raise SystemExit("Frozen scenario source must cover the exact 32 stored scenarios")
          for row in definitions:
              env = {"pusht": "gym_pusht/PushT-v0", "aloha": "gym_aloha/AlohaTransferCube-v0"}.get(row.get("env"))
              prior = stored[row["scenario_id"]]
              if (env != prior[0] or row["params"] != json.loads(prior[1]) or row["baseline_success"] != prior[2]
                      or len(row["seeds"]) != 50 or len(set(row["seeds"])) != 50
                      or any(type(seed) is not int or seed < 0 for seed in row["seeds"])):
                  raise SystemExit("Frozen scenario parameters, baseline or seeds differ from the prepared source")
          risk = json.loads((root / "risk-calibration.json").read_text())
          partition = manifest.get("calibration_partition", {})
          fit, held = partition.get("fit_change_ids", []), partition.get("risk_change_ids", [])
          if (not isinstance(fit, list) or not isinstance(held, list) or len(fit) != 7 or len(held) != 19
                  or not all(isinstance(value, str) and re.fullmatch(r"c[0-9]{3,}", value) for value in fit + held)
                  or len(set(fit + held)) != 26):
              raise SystemExit("Decision bundle must preserve the independent seven-fit/nineteen-risk partition")
          compiled = _compiled_rows(root / "compiled.jsonl")
          expected_fit, expected_held = calibration_partition(row["change"] for row in compiled
                                                              if row["split"] == "calibration")
          training = sorted({row["change"] for row in compiled if row["split"] == "train"})
          if (fit != expected_fit or held != expected_held
                  or risk.get("t1", {}).get("calibration_change_ids") != fit
                  or risk.get("t1", {}).get("training_change_ids") != training):
              raise SystemExit("Decision bundle fitting pools differ from the frozen compiled changes")
          if (risk.get("model_version") != manifest.get("model_version")
                  or not re.fullmatch(r"[^\s@]+@[0-9a-f]{40}\+lora@[0-9a-f]{64}", str(manifest.get("model_version")))
                  or risk.get("t1") != json.loads((root / "t1.json").read_text())
                  or sorted(risk.get("probability_calibration_change_ids", [])) != sorted(fit)
                  or sorted(change["change_id"] for change in risk.get("changes", [])) != sorted(held)):
              raise SystemExit("Decision bundle model and calibration provenance disagree")
          PY
      - name: Validate baseline identity and run the cheap tier
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          from brier_sim.runner import run_episodes

          root = Path(os.environ["BRIER_DATA"])
          inputs = Path(os.environ["RUNNER_TEMP"]) / "brier-ci"
          binary = str(inputs / "brier")
          card = json.loads((inputs / "card.json").read_text())
          baselines = {"gym_pusht/PushT-v0": "baseline-policy.yaml",
                       "gym_aloha/AlohaTransferCube-v0": "aloha-baseline-policy.yaml"}
          evidence = subprocess.check_output([binary, "card", "--before", str(root / baselines[card["env"]]),
              "--after", str(inputs / "before.yaml"), "--change", card["change_id"]], text=True)
          if not json.loads(evidence)["t0_identical"]:
              raise SystemExit("The stored 50-episode baseline does not match the deployed policy identity")
          env = {"gym_pusht/PushT-v0": "pusht", "gym_aloha/AlohaTransferCube-v0": "aloha"}[card["env"]]
          definitions = [json.loads(line) for line in (root / "scenarios.jsonl").read_text().splitlines()
                         if json.loads(line)["env"] == env]
          change = {"change_id": card["change_id"], "env": env, "families": card["card"]["families"],
                    "desc": card["card"]["description"], "seed": int(card["change_id"][1:])}
          catalog = {"changes": [{"change_id": card["change_id"], "env": card["env"], "card": change}],
                     "scenarios": [{**scenario, "env": card["env"]} for scenario in definitions]}
          (root / "current-catalog.json").write_text(json.dumps(catalog) + "\n")
          cheap = root / "cheap"
          cheap.mkdir()
          for scenario in definitions:
              path = run_episodes(card["env"], card["policy"]["id"], 3, scenario["seeds"][0],
                  card["change_id"], scenario["scenario_id"], "cheap", change=change, scenario=scenario,
                  revision=card["policy"]["revision"])
              path.rename(cheap / f"{scenario['scenario_id']}.parquet")
          subprocess.run([binary, "label", "--ledger", str(root / "ledger.sqlite"),
              "--episodes", str(cheap), "--catalog", str(root / "current-catalog.json")], check=True)
          with (root / "decisions.json").open("w") as target:
              subprocess.run([binary, "decide", "--ledger", str(root / "ledger.sqlite"),
                  "--compiled", str(root / "compiled.jsonl"), "--calibration", str(root / "risk-calibration.json"),
                  "--change", card["change_id"]], stdout=target, check=True)
          PY
      - name: Run and label selected expensive evaluations
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          from brier_sim.runner import run_episodes

          root = Path(os.environ["BRIER_DATA"])
          inputs = Path(os.environ["RUNNER_TEMP"]) / "brier-ci"
          card = json.loads((inputs / "card.json").read_text())
          decisions = json.loads((root / "decisions.json").read_text())["decisions"]
          env = {"gym_pusht/PushT-v0": "pusht", "gym_aloha/AlohaTransferCube-v0": "aloha"}[card["env"]]
          definitions = {scenario["scenario_id"]: scenario for scenario in
                         (json.loads(line) for line in (root / "scenarios.jsonl").read_text().splitlines()) if scenario["env"] == env}
          change = json.loads((root / "current-catalog.json").read_text())["changes"][0]["card"]
          expensive = root / "expensive"
          expensive.mkdir()
          for decision in decisions:
              if decision["action"] == "skip":
                  continue
              if decision["action"] != "expensive":
                  raise SystemExit(f"Unsupported requested action: {decision['action']}")
              scenario = definitions[decision["scenario_id"]]
              path = run_episodes(card["env"], card["policy"]["id"], 20, scenario["seeds"][0],
                  card["change_id"], scenario["scenario_id"], "expensive", change=change, scenario=scenario,
                  revision=card["policy"]["revision"])
              path.rename(expensive / f"{scenario['scenario_id']}.parquet")
          if any(decision["action"] == "expensive" for decision in decisions):
              subprocess.run([str(inputs / "brier"), "label", "--ledger", str(root / "ledger.sqlite"),
                  "--episodes", str(expensive), "--catalog", str(root / "current-catalog.json")], check=True)
          PY
      - name: Explain every failed expensive episode
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sqlite3
          import subprocess

          root = Path(os.environ["BRIER_DATA"])
          inputs = Path(os.environ["RUNNER_TEMP"]) / "brier-ci"
          card = json.loads((inputs / "card.json").read_text())
          with sqlite3.connect(root / "ledger.sqlite") as connection:
              runs = connection.execute("SELECT run_id FROM runs WHERE change_id=? AND tier='expensive' AND episodes=20 AND successes<episodes ORDER BY scenario_id", (card["change_id"],)).fetchall()
          explanations = []
          for (run,) in runs:
              result = subprocess.check_output([str(inputs / "brier"), "explain", "--ledger", str(root / "ledger.sqlite"), "--run", run], text=True)
              explanations.append(json.loads(result))
          (root / "explanations.json").write_text(json.dumps(explanations, indent=2) + "\n")
          PY
      - name: Publish recorded evidence before linking it
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["BRIER_DATA"])
          source = (Path(os.environ["RUNNER_TEMP"]) / "brier-cloud-source.txt").read_text()
          if (root / "public").is_dir():
              subprocess.run(["gcloud", "storage", "cp", "--recursive", str(root / "public"), source + "/"], check=True)
          (root / "published.json").write_text(json.dumps({"storage": source}) + "\n")
          PY
      - name: Write the check summary and verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["BRIER_DATA"])
          inputs = Path(os.environ["RUNNER_TEMP"]) / "brier-ci"
          if not (root / "decisions.json").is_file():
              raise SystemExit("No complete decision stage exists; Robot CI cannot report a pass")
          card = json.loads((inputs / "card.json").read_text())
          command = [str(inputs / "brier"), "report", "--ledger", str(root / "ledger.sqlite"),
              "--change", card["change_id"], "--out", str(root / "report.md"),
              "--metrics", str(root / "report.json")]
          published = root / "published.json"
          environment = dict(os.environ)
          if published.is_file():
              environment["BRIER_DATA"] = json.loads(published.read_text())["storage"]
              command += ["--push", os.environ["BRIER_INGEST_URL"]]
          result = subprocess.run(command, env=environment, capture_output=True, text=True)
          if result.stdout.strip():
              (root / "report.json").write_text(json.dumps(json.loads(result.stdout), indent=2) + "\n")
          if (root / "report.md").is_file():
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as target:
                  if not published.is_file():
                      target.write("## Robot CI incomplete\n\nAn evaluation, explanation or evidence-publication stage failed. The diagnostic report below does not complete the CI gate.\n\n")
                  target.write((root / "report.md").read_text())
          if result.stderr:
              print(result.stderr, end="")
          if not published.is_file():
              raise SystemExit("Robot CI did not complete all required stages")
          raise SystemExit(result.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-ci-results
          path: ${{ runner.temp }}/brier-data
          if-no-files-found: error
