[package]
name = "brier-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "brier"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "57", default-features = false, features = ["snap"] }
uuid = { version = "1", features = ["v4"] }
