[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brier"
version = "0.1.0"
description = "Simulation and model training for Brier Robot CI"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["py"]
include = ["brier_sim*", "brier_ml*", "brier_explain*"]
namespaces = false

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["py/tests"]
