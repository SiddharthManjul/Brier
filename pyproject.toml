[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brier"
version = "0.1.0"
description = "Simulation and model training for Brier Robot CI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "lerobot[pusht,aloha]==0.3.3",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchcodec==0.4.0",
    "huggingface-hub>=0.34.2,<1",
    "gym-pusht==0.1.8",
    "gym-aloha==0.1.5",
    "pyarrow==20.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["py"]
include = ["brier_sim*", "brier_ml*", "brier_explain*"]
namespaces = false

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["py/tests"]
